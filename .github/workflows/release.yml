name: Release

# Publishes the built bundle as a release asset whenever a version tag is
# pushed. HACS installs the card by downloading `schematic-flow-card.js`
# from the release assets, so this workflow is what makes installs work.

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/schematic-flow-card.js
          generate_release_notes: true
          fail_on_unmatched_files: true
